name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GridAtlas3D/package-lock.json

      - name: Build GridAtlas3D
        run: |
          npm ci --prefix GridAtlas3D
          npm run build --prefix GridAtlas3D

      - name: Inject FIRMS MAP_KEY
        run: >
          sed -i
          "s/__FIRMS_MAP_KEY__/${{ secrets.FIRMS_MAP_KEY }}/g"
          js/config.js

      - name: Stage runtime files
        shell: bash
        run: |
          mkdir -p deploy/data
          mkdir -p deploy/GridAtlas3D
          cp index.html deploy/
          cp manifest.webmanifest deploy/
          cp -r assets deploy/
          cp -r css js deploy/
          cp -r GridAtlas3D/dist/. deploy/GridAtlas3D/
          cp -r data/countries deploy/data/
          cp .nojekyll deploy/
          test ! -e deploy/spain_osm_power_grid_50kv_plus_full.geojson
          test ! -e deploy/france_osm_power_grid_50kv_plus_full.geojson
          test -f deploy/assets/icons/gridrisk-atlas-header.png
          test -f deploy/assets/icons/gridrisk-atlas-512.png
          test -f deploy/js/locales/tr.js
          test -f deploy/js/locales/en.js
          test -f deploy/GridAtlas3D/index.html
          test -f deploy/data/countries/IT/manifest.json
          test -f deploy/data/countries/GR/manifest.json
          grep -q '"start_url": "./?country=TR&lang=tr"' deploy/manifest.webmanifest
          grep -q '"scope": "./"' deploy/manifest.webmanifest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "deploy"

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
