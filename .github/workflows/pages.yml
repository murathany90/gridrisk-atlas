name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject FIRMS MAP_KEY
        run: >
          sed -i
          "s/__FIRMS_MAP_KEY__/${{ secrets.FIRMS_MAP_KEY }}/g"
          js/config.js

      - name: Stage runtime files
        shell: bash
        run: |
          mkdir -p deploy/data
          cp index.html deploy/
          cp -r css js deploy/
          cp -r data/countries deploy/data/
          cp .nojekyll deploy/
          test ! -e deploy/spain_osm_power_grid_50kv_plus_full.geojson
          test ! -e deploy/france_osm_power_grid_50kv_plus_full.geojson

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'deploy'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
